name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Python ${{ matrix.python-version }} source gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Run fail-fast source gate
        run: python scripts/release_check.py --skip-build

  package:
    name: Reproducible package and installed-runtime gate
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Run complete release gate
        run: python scripts/release_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: dutybell-release-candidate
          path: dist/
          if-no-files-found: error

  container:
    name: Container build and non-root diagnostic
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag dutybell:ci .
      - name: Verify packaged command
        run: docker run --rm dutybell:ci --version
      - name: Verify non-root database and static assets
        run: docker run --rm dutybell:ci doctor --database /tmp/dutybell-doctor.db
